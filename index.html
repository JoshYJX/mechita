<!DOCTYPE html><="es">
<head>
  <meta charset="UTF-8">
  <title>La Mechita</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- NAVBAR (MENÚ SUPERIOR) -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">La Mechita</a>

    <!-- Botón hamburguesa para dispositivos móviles -->
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Enlaces del menú -->
    <div class="collapse navbar-collapse" id="menuNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

        <!-- Links de navegación -->
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>

        <!-- Botón destacado -->
        <li class="nav-item">
          <a class="btn btn-outline-gold ms-lg-3 mt-2 mt-lg-0" href="reservar.html">Reservar</a>
        </li>

      </ul>
    </div>

  </div>
</nav>


<!-- =========================
     HERO (SECCIÓN PRINCIPAL)
========================= -->
<section class="hero d-flex align-items-center text-center">

  <div class="container pt-5">

    <!-- Texto pequeño superior -->
    <small class="hero-tagline d-block mb-3">
      TRADICIÓN · SABOR · FAMILIA
    </small>

    <!-- Título principal -->
    <h1 class="hero-title mb-3">
      Bienvenidos a La Mechita
    </h1>

    <!-- Subtítulo -->
    <p class="hero-subtitle mb-4">
      Cocina auténtica guatemalteca con el sabor de siempre
    </p>

    <!-- Botones principales -->
    <div class="d-flex justify-content-center gap-3 flex-wrap mb-5">

      <!-- Botón hacia menú -->
      <a href="menu.html" class="btn btn-gold">VER MENÚ</a>

      <!-- Botón hacia reservas -->
      <a href="reservar.html" class="btn btn-outline-gold">HACER RESERVACIÓN</a>

    </div>


    <!-- =========================
         SLIDER / CARRUSEL
    ========================== -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

        <!-- Contenedor del carrusel -->
        <div class="carousel-wrapper rounded shadow">

          <!-- Carrusel Bootstrap -->
          <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

            <!-- Contenedor de imágenes -->
            <div class="carousel-inner">

              <!-- Imagen activa -->
              <div class="carousel-item active">
                <img src="imagenes/jocon.jpg" alt="Jocón guatemalteco">
              </div>

              <!-- Imagen 2 -->
              <div class="carousel-item">
                <img src="imagenes/kaqik.jpg" alt="Kak'ik guatemalteco">
              </div>

              <!-- Imagen 3 -->
              <div class="carousel-item">
                <img src="imagenes/pepian.jpg" alt="Pepián tradicional">
              </div>

            </div>

            <!-- Botón anterior -->
            <button class="carousel-control-prev" data-bs-target="#heroCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- Botón siguiente -->
            <button class="carousel-control-next" data-bs-target="#heroCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>

          </div>

        </div>

      </div>
    </div>

  </div>
</section>


<!-- FOOTER -->
<footer class="site-footer">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 La Mechita. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
