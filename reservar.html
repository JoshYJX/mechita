<!-- =========================
     SECCIÓN RESERVA
========================= -->
<section class="gallery-section text-center pt-5 mt-5">
    <div class="container">

        <!-- Etiqueta superior -->
        <small class="reservation-tag">RESERVA TU MESA</small>

        <!-- Título -->
        <h2 class="reservation-title mt-3 mb-5">
            Asegura tu lugar y vive la experiencia La Mechita
        </h2>


    <!-- =========================
         FORMULARIO DE RESERVA
    ========================== -->
    <form action="https://formsubmit.co/yonajosue@gmail.com" method="POST" class="row g-3 justify-content-center">

    <!-- Nombre -->
    <div class="col-md-4">
        <input type="text" name="Nombre" class="form-control custom-input" placeholder="Nombre completo" required>
    </div>

    <!-- Teléfono -->
    <div class="col-md-4">
        <input type="tel" name="Telefono" class="form-control custom-input" placeholder="Teléfono / WhatsApp" required>
    </div>

    <!-- Fecha -->
    <div class="col-md-4">
        <input type="date" name="Fecha" class="form-control custom-input" required>
    </div>

    <!-- Hora -->
    <div class="col-md-4">
        <input type="time" name="Hora" class="form-control custom-input" required>
    </div>

    <!-- Número de personas -->
    <div class="col-md-4">
        <input type="number" name="Personas" class="form-control custom-input" placeholder="N.° de personas" required min="1">
    </div>

    <!-- Ocasión -->
    <div class="col-md-4">
        <input type="text" name="Ocasion" class="form-control custom-input" placeholder="Ocasión especial (opcional)">
    </div>

    <!-- =========================
         CONFIGURACIÓN OCULTA
    ========================== -->

    <!-- Desactiva captcha -->
    <input type="hidden" name="_captcha" value="false">

    <!-- Asunto del correo -->
    <input type="hidden" name="_subject" value="Nueva reserva - La Mechita">

    <!-- Formato del correo -->
    <input type="hidden" name="_template" value="table">


    <!-- BOTÓN DE ENVÍO -->
    <div class="col-12 mt-4">
        <button type="submit" class="btn btn-gold px-5 py-2">
            CONFIRMAR RESERVACIÓN
        </button>
    </div>

</form>

    </div>
</section>
